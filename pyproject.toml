[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerquant"
version = "0.1.0"
description = "Controlled bias-reduction steering experiments under weight quantization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "PyYAML>=6,<7", "torch>=2.4,<3",
  "transformers>=4.57,<5", "accelerate>=1,<2", "safetensors>=0.4,<1"
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.48,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
steerquant = "steerquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
