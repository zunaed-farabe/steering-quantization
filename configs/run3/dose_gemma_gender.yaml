# Run 3 dose test (docs/run3.md): gender, gemma. BF16, validation only; never evaluate test here.
# Stereotype contrast, same layers, strengths and pass rule as run 2.
# Generated by scripts/make_run3_configs.py.
seed: 42
model:
  id: google/gemma-2-9b-it
  revision: main
  device: cuda:0
  compute_dtype: bfloat16
  attention: eager
precisions: [bf16]
data:
  prepared: data/prepared/gender
  train_limit: 128
  validation_limit: null
  test_limit: null
steering:
  layers: [12, 20, 28]
  method: mean_difference
  positions: last
  strengths: [-0.6, -0.3, -0.15, -0.1, 0.0, 0.1, 0.15, 0.3, 0.6]
  sources: [reference, random]
  contrast: stereotype
evaluation:
  max_new_tokens: 12
  fairness_prompt: false
  include_prompt_baseline: true
output:
  root: artifacts/run3/dose-gemma-gender
