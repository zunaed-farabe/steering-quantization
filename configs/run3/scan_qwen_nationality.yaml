# Run 3 bias scan (docs/run3.md): nationality, qwen. Unsteered and prompt baselines only,
# BF16, validation. No vector is extracted or applied. Generated by scripts/make_run3_configs.py.
seed: 42
model:
  id: Qwen/Qwen2.5-7B-Instruct
  revision: main
  device: cuda:0
  compute_dtype: bfloat16
  attention: eager
precisions: [bf16]
data:
  prepared: data/prepared/nationality
  train_limit: 128
  validation_limit: null
  test_limit: null
steering:
  layers: []
  method: mean_difference
  positions: last
  strengths: [0.0]
  sources: []
evaluation:
  max_new_tokens: 12
  fairness_prompt: false
  include_prompt_baseline: true
output:
  root: artifacts/run3/scan-qwen-nationality
